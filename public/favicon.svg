<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <style>
    .bg { fill: #FAF8F5; }
    .book { fill: #1D1D1B; }
    .arrow { fill: #C96F55; }
    .spine { stroke: #1D1D1B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0A0714; }
      .book { fill: #8B5CF6; }
      .arrow { fill: #8B5CF6; }
      .spine { stroke: #8B5CF6; }
    }
  </style>

  <rect class="bg" width="512" height="512" rx="112" />

  <g id="favicon-mark" transform="scale(0.96) translate(10, 10)">
    <!-- Summit Beacon -->
    <circle class="arrow" cx="256" cy="116" r="18" />

    <!-- Accomplishment Arrow -->
    <path class="arrow"
      d="M 256 156 
         L 326 238 
         H 284 
         V 296 
         H 228 
         V 238 
         H 186 
         Z" 
    />

    <!-- Academic Open Book Pages -->
    <path class="book"
      d="M 120 338 
         C 164 314, 212 316, 244 340 
         L 244 378 
         C 208 350, 160 348, 120 370 
         Z" 
    />

    <path class="book"
      d="M 392 338 
         C 348 314, 300 316, 268 340 
         L 268 378 
         C 304 350, 352 348, 392 370 
         Z" 
    />

    <!-- Minimal Foundation Spine -->
    <path class="spine"
      d="M 144 398 
         C 190 384, 230 388, 256 402 
         C 282 388, 322 384, 368 398" 
      stroke-width="12" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>
</svg>
