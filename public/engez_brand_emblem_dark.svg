<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Minimalist dark obsidian rounded container with subtle purple glow border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0A0714" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="4" />

  <g id="minimal-engez-mark-dark">
    <!-- 1. Summit Beacon of Mastery (Website Purple #8B5CF6) -->
    <circle cx="256" cy="118" r="16" fill="#8B5CF6" />

    <!-- 2. Dynamic Upward Accomplishment Arrow ("Engez" / Progress - Website Purple #8B5CF6) -->
    <path 
      d="M 256 158 
         L 322 236 
         H 282 
         V 292 
         H 230 
         V 236 
         H 190 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- 3. Open Book Pages (Academic Study & Knowledge - Website Purple #8B5CF6) -->
    <!-- Left Open Page -->
    <path 
      d="M 124 336 
         C 166 312, 212 314, 244 338 
         L 244 374 
         C 210 348, 164 346, 124 368 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- Right Open Page -->
    <path 
      d="M 388 336 
         C 346 312, 300 314, 268 338 
         L 268 374 
         C 302 348, 348 346, 388 368 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- 4. Minimalist Foundation Line (Spine & Foundation - Website Purple #8B5CF6) -->
    <path 
      d="M 148 396 
         C 192 384, 230 388, 256 400 
         C 282 388, 320 384, 364 396" 
      stroke="#8B5CF6" 
      stroke-width="10" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>
</svg>
