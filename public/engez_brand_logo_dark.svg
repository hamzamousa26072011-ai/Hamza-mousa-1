<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220" fill="none">
  <!-- Minimalist dark obsidian background -->
  <rect width="780" height="220" rx="28" fill="#141210" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="2" />

  <!-- MINIMAL EMBLEM (Left) -->
  <g transform="translate(24, 10) scale(0.39)">
    <!-- Summit Beacon (Website Purple #8B5CF6) -->
    <circle cx="256" cy="118" r="16" fill="#8B5CF6" />

    <!-- Upward Accomplishment Arrow (Website Purple #8B5CF6) -->
    <path 
      d="M 256 158 
         L 322 236 
         H 282 
         V 292 
         H 230 
         V 236 
         H 190 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- Left Open Page (Website Purple #8B5CF6) -->
    <path 
      d="M 124 336 
         C 166 312, 212 314, 244 338 
         L 244 374 
         C 210 348, 164 346, 124 368 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- Right Open Page (Website Purple #8B5CF6) -->
    <path 
      d="M 388 336 
         C 346 312, 300 314, 268 338 
         L 268 374 
         C 302 348, 348 346, 388 368 
         Z" 
      fill="#8B5CF6" 
    />

    <!-- Foundation Spine Line (Website Purple #8B5CF6) -->
    <path 
      d="M 148 396 
         C 192 384, 230 388, 256 400 
         C 282 388, 320 384, 364 396" 
      stroke="#8B5CF6" 
      stroke-width="10" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(245, 0)">
    <!-- Primary Latin Title -->
    <text x="0" y="112" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="#FAF8F5">Engez Nafsak</text>

    <!-- Subtitle: Arabic Brand in Website Purple -->
    <text x="2" y="162" 
          font-family="'Noto Sans Arabic', 'Cairo', 'Almarai', system-ui, sans-serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#8B5CF6">إنجز نفسك</text>

    <text x="180" y="160" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#C4B5FD">ACADEMIC SUITE</text>
  </g>
</svg>