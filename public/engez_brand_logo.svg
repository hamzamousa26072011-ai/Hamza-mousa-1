<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220" fill="none">
  <!-- Minimalist warm background matching light theme -->
  <rect width="780" height="220" rx="28" fill="#FAF8F5" stroke="#E8D7C9" stroke-width="2" />

  <!-- MINIMAL EMBLEM (Left) -->
  <g transform="translate(24, 10) scale(0.39)">
    <!-- Summit Beacon (Light theme terracotta #C96F55) -->
    <circle cx="256" cy="118" r="16" fill="#C96F55" />

    <!-- Upward Accomplishment Arrow (Light theme terracotta #C96F55) -->
    <path 
      d="M 256 158 
         L 322 236 
         H 282 
         V 292 
         H 230 
         V 236 
         H 190 
         Z" 
      fill="#C96F55" 
    />

    <!-- Left Open Page (Light theme obsidian #1D1D1B) -->
    <path 
      d="M 124 336 
         C 166 312, 212 314, 244 338 
         L 244 374 
         C 210 348, 164 346, 124 368 
         Z" 
      fill="#1D1D1B" 
    />

    <!-- Right Open Page (Light theme obsidian #1D1D1B) -->
    <path 
      d="M 388 336 
         C 346 312, 300 314, 268 338 
         L 268 374 
         C 302 348, 348 346, 388 368 
         Z" 
      fill="#1D1D1B" 
    />

    <!-- Foundation Spine Line (Light theme obsidian #1D1D1B) -->
    <path 
      d="M 148 396 
         C 192 384, 230 388, 256 400 
         C 282 388, 320 384, 364 396" 
      stroke="#1D1D1B" 
      stroke-width="10" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(245, 0)">
    <!-- Primary Latin Title -->
    <text x="0" y="112" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="#1D1D1B">Engez Nafsak</text>

    <!-- Subtitle: Arabic Brand in Terracotta #C96F55 matching light theme -->
    <text x="2" y="162" 
          font-family="'Noto Sans Arabic', 'Cairo', 'Almarai', system-ui, sans-serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#C96F55">إنجز نفسك</text>

    <text x="180" y="160" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#77736B">ACADEMIC SUITE</text>
  </g>
</svg>